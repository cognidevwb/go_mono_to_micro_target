# Local fleet: `docker compose up --build`. One database per service —
# no service can reach another's tables.
name: platform

services:
  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catalog_app
      POSTGRES_PASSWORD: catalog_app
      POSTGRES_DB: catalogdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_app -d catalogdb"]
      interval: 5s
      retries: 10

  customers-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: customers_app
      POSTGRES_PASSWORD: customers_app
      POSTGRES_DB: customersdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customers_app -d customersdb"]
      interval: 5s
      retries: 10

  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: inventory_app
      POSTGRES_DB: inventorydb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d inventorydb"]
      interval: 5s
      retries: 10

  payments-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payments_app
      POSTGRES_PASSWORD: payments_app
      POSTGRES_DB: paymentsdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments_app -d paymentsdb"]
      interval: 5s
      retries: 10

  orders-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orders_app
      POSTGRES_PASSWORD: orders_app
      POSTGRES_DB: ordersdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_app -d ordersdb"]
      interval: 5s
      retries: 10

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.129.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [lgtm]

  lgtm:
    image: grafana/otel-lgtm:0.11.4
    ports: ["3000:3000"]

  catalog-service:
    build: { context: ., dockerfile: services/catalog/Dockerfile }
    environment:
      OTEL_SERVICE_NAME: catalog-service
      DATABASE_URL: postgres://catalog_app:catalog_app@catalog-db:5432/catalogdb?sslmode=disable
      BROKER_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    depends_on:
      catalog-db: { condition: service_healthy }
      nats: { condition: service_started }

  customers-service:
    build: { context: ., dockerfile: services/customers/Dockerfile }
    environment:
      OTEL_SERVICE_NAME: customers-service
      DATABASE_URL: postgres://customers_app:customers_app@customers-db:5432/customersdb?sslmode=disable
      BROKER_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    depends_on:
      customers-db: { condition: service_healthy }
      nats: { condition: service_started }

  inventory-service:
    build: { context: ., dockerfile: services/inventory/Dockerfile }
    environment:
      OTEL_SERVICE_NAME: inventory-service
      DATABASE_URL: postgres://inventory_app:inventory_app@inventory-db:5432/inventorydb?sslmode=disable
      BROKER_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    depends_on:
      inventory-db: { condition: service_healthy }
      nats: { condition: service_started }

  payments-service:
    build: { context: ., dockerfile: services/payments/Dockerfile }
    environment:
      OTEL_SERVICE_NAME: payments-service
      DATABASE_URL: postgres://payments_app:payments_app@payments-db:5432/paymentsdb?sslmode=disable
      BROKER_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PAYMENTS_URL: ${PAYMENTS_URL:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    depends_on:
      payments-db: { condition: service_healthy }
      nats: { condition: service_started }

  orders-service:
    build: { context: ., dockerfile: services/orders/Dockerfile }
    environment:
      OTEL_SERVICE_NAME: orders-service
      DATABASE_URL: postgres://orders_app:orders_app@orders-db:5432/ordersdb?sslmode=disable
      BROKER_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CATALOG_SERVICE_URL: http://catalog-service:8080
      CUSTOMERS_SERVICE_URL: http://customers-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      PAYMENTS_SERVICE_URL: http://payments-service:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    depends_on:
      orders-db: { condition: service_healthy }
      nats: { condition: service_started }

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    ports: ["8080:8080"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LEGACY_UPSTREAM: ${LEGACY_UPSTREAM:-http://host.docker.internal:8080}
